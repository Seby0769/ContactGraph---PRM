services:
  db:
    image: postgres:16-alpine
    container_name: dossier_db
    environment:
      POSTGRES_DB: dossier_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - dossier_pgdata:/var/lib/postgresql/data

volumes:
  dossier_pgdata: